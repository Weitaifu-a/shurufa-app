name: 打包安卓和苹果安装包

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android:
    name: 安卓安装包 - ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: 云端版
            pkg: appcloud
            label: 云端版
            internet: 'yes'
          - dir: 本地版
            pkg: applocal
            label: 本地版
            internet: 'no'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 同意安卓许可协议
        run: yes | flutter doctor --android-licenses || true

      - name: 生成安卓工程
        run: |
          set -e
          flutter create --platforms=android --org com.shurufa --project-name ${{ matrix.pkg }} proj
          cp -rf "${{ matrix.dir }}/lib" proj/
          cp -f "${{ matrix.dir }}/pubspec.yaml" proj/pubspec.yaml
          mkdir -p proj/assets
          cp -f "${{ matrix.dir }}/assets"/*.txt proj/assets/

      - name: 设置应用名称
        run: |
          sed -i 's|android:label="${{ matrix.pkg }}"|android:label="输入法${{ matrix.label }}"|' proj/android/app/src/main/AndroidManifest.xml

      - name: 开通联网权限（仅云端版需要）
        if: matrix.internet == 'yes'
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' proj/android/app/src/main/AndroidManifest.xml

      - name: 开始打包 APK
        run: |
          cd proj
          flutter pub get
          flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 输入法-${{ matrix.label }}-安卓
          path: proj/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: 苹果安装包 - ${{ matrix.label }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: 云端版
            pkg: appcloud
            label: 云端版
          - dir: 本地版
            pkg: applocal
            label: 本地版
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成苹果工程
        run: |
          set -e
          flutter create --platforms=ios --org com.shurufa --project-name ${{ matrix.pkg }} proj
          cp -rf "${{ matrix.dir }}/lib" proj/
          cp -f "${{ matrix.dir }}/pubspec.yaml" proj/pubspec.yaml
          mkdir -p proj/assets
          cp -f "${{ matrix.dir }}/assets"/*.txt proj/assets/

      - name: 编译（不做签名）
        run: |
          cd proj
          flutter pub get
          flutter build ios --release --no-codesign

      - name: 打包成 ipa（苹果安装包）
        run: |
          cd proj/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/输入法-${{ matrix.label }}-苹果.ipa" Payload

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: 输入法-${{ matrix.label }}-苹果
          path: 输入法-${{ matrix.label }}-苹果.ipa
